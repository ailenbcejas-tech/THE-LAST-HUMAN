@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{font-family:'Space Grotesk',system-ui,sans-serif;color:#f2f0eb;background:#070707;--red:#ff4d3d;--muted:#858581;--line:#252522;--panel:#0e0e0d}*{box-sizing:border-box}body{margin:0;background:#070707}button{font:inherit;color:inherit}.app{min-height:100vh;overflow:hidden;position:relative;background:radial-gradient(circle at 70% 20%,rgba(255,77,61,.09),transparent 27%),#070707}.noise{position:fixed;inset:0;opacity:.045;pointer-events:none;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.8'/%3E%3C/svg%3E")}.topbar{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 clamp(20px,4vw,64px);position:relative;z-index:2}.brand{border:0;background:none;cursor:pointer;font-size:12px;letter-spacing:.13em;font-weight:700}.brand-mark{color:var(--red);margin-right:9px}.status,footer,.tiny-label,.eyebrow,.decision-label,.challenge-meta,.score,.micro,.warning{font-family:'DM Mono',monospace}.status{font-size:10px;color:#74746f;letter-spacing:.08em}.dot,.pulse{display:inline-block;width:6px;height:6px;border-radius:50%;background:#6ee7a8;box-shadow:0 0 12px #6ee7a8;margin-right:7px}.sep{margin:0 10px;color:#383834}.home{max-width:1180px;margin:auto;padding:clamp(70px,10vw,130px) 30px 80px}.hero{max-width:930px}.eyebrow{font-size:11px;color:#a8a8a1;letter-spacing:.15em;margin-bottom:30px}.hero h1,.result h1{font-size:clamp(64px,10vw,132px);line-height:.82;letter-spacing:-.07em;margin:0;font-weight:700}.hero h1 em,.result h1 em{font-style:normal;color:transparent;-webkit-text-stroke:1px #efeee9}.lede{font-size:18px;line-height:1.6;color:#999995;max-width:650px;margin:42px 0}.lede strong{color:#e7e5df;font-weight:500}.actions{display:flex;align-items:center;gap:20px}.primary{border:0;background:#f1efe8;color:#0a0a09;padding:15px 19px;display:inline-flex;align-items:center;gap:10px;cursor:pointer;font-weight:700;font-size:12px;letter-spacing:.04em;transition:.2s}.primary:hover{transform:translateY(-2px);background:white}.micro{font-size:10px;color:#676762;display:flex;gap:7px;align-items:center}.home-grid{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);margin-top:100px}.protocol,.index-card{padding:28px 0}.index-card{border-left:1px solid var(--line);padding-left:35px}.tiny-label{font-size:10px;letter-spacing:.12em;color:#666660;display:flex;align-items:center;gap:8px}.protocol-line{display:flex;gap:28px;margin-top:30px}.protocol-line>span{font:11px 'DM Mono';color:var(--red)}.protocol-line b{display:block;font-size:14px}.protocol-line small{display:block;color:#656560;margin-top:5px}.big-index{font-size:88px;line-height:1;font-weight:600;letter-spacing:-.08em;margin-top:25px}.big-index span{font-size:20px;color:#555550}.index-card p,.index-card small{color:#64645f;font-size:11px}.index-bars{display:flex;gap:5px;margin:20px 0 12px}.index-bars i{height:4px;width:42px;background:#22221f}.index-bars i:first-child{background:var(--red)}.warning{border:1px solid var(--line);color:#555550;padding:12px 15px;font-size:9px;letter-spacing:.05em;display:flex;gap:8px;align-items:center;margin-top:50px}.game,.result{max-width:960px;margin:auto;padding:55px 25px 100px}.game-head{display:flex;justify-content:space-between;align-items:end;margin-bottom:45px}.progress{width:min(620px,65vw);height:3px;background:#20201d;margin-top:12px}.progress i{display:block;height:100%;background:var(--red);transition:.5s}.score{font-size:10px;color:#555550}.score b{color:#eee;margin-left:8px}.challenge{border:1px solid #292925;background:linear-gradient(145deg,#0d0d0c,#0a0a09);padding:clamp(22px,4vw,48px);position:relative}.challenge:before{content:'';position:absolute;left:-1px;top:-1px;width:70px;height:1px;background:var(--red)}.challenge-meta{display:flex;gap:18px;color:#686862;font-size:9px;letter-spacing:.08em}.challenge-meta span:first-child{color:#b1b1aa}.challenge h2{font-size:clamp(30px,5vw,50px);letter-spacing:-.04em;margin:28px 0 5px}.meta{font-size:11px;color:#666660;margin:0 0 30px}.artifact{border:1px solid #262622;background:#080807;padding:24px;min-height:150px;white-space:pre-wrap}.artifact pre{font:14px/1.75 'DM Mono',monospace;color:#bdbdb5;margin:0;white-space:pre-wrap}.code-top,.chat-label{font:9px 'DM Mono';color:#5d5d58;border-bottom:1px solid #20201d;padding-bottom:12px;margin-bottom:18px}.code-top span{float:right}.decision-label{text-align:center;font-size:9px;color:#5e5e58;letter-spacing:.15em;margin:35px 0 14px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}.choice{background:#10100f;border:1px solid #282824;padding:20px;text-align:left;cursor:pointer;display:grid;grid-template-columns:auto 1fr;column-gap:14px;align-items:center;transition:.2s}.choice .icon{grid-row:span 2;font-size:24px}.choice span{font-weight:700;letter-spacing:.08em}.choice small{color:#60605b;margin-top:4px}.choice:hover{border-color:#77776e;transform:translateY(-2px)}.choice.ai:hover,.choice.ai.chosen{border-color:var(--red)}.choice.human:hover,.choice.human.chosen{border-color:#d6d4cc}.choice.disabled{cursor:default;opacity:.7}.reveal{margin-top:15px;padding:20px;border-left:2px solid #77776e;background:#121210}.reveal.wrong{border-color:var(--red)}.reveal-top{display:flex;justify-content:space-between;font:10px 'DM Mono';letter-spacing:.06em}.reveal.correct .reveal-top span{color:#76d6a1}.reveal.wrong .reveal-top span{color:var(--red)}.reveal p{font-size:13px;line-height:1.65;color:#aaa9a2;max-width:750px}.why{background:none;border:0;padding:0;color:#ddd9d0;font:10px 'DM Mono';cursor:pointer}.signals{margin-top:18px;border-top:1px solid #282824;padding-top:15px}.signal{margin:13px 0}.signal-head{display:flex;justify-content:space-between;font:10px 'DM Mono';color:#777770}.signal-head b{color:#ccc8c0}.signal-bar{height:3px;background:#242420;margin-top:7px}.signal-bar i{display:block;height:100%;background:#888}.next{margin-top:25px;border:1px solid #3a3a35;background:#e8e5dd;color:#080807;padding:12px 15px;font-size:10px;font-weight:700;letter-spacing:.04em;cursor:pointer}.result-kicker{font:10px 'DM Mono';color:#777770;margin-bottom:25px}.result h1{font-size:clamp(54px,8vw,96px)}.result-lede{color:#898983;max-width:570px;line-height:1.6;margin:30px 0 55px}.result-layout{display:grid;grid-template-columns:270px 1fr;gap:55px;align-items:center}.score-orb{width:230px;height:230px;border:1px solid #393934;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle,#171714,#080807);position:relative}.score-orb:after{content:'';position:absolute;inset:9px;border:1px dashed #2d2d29;border-radius:50%}.score-orb>div{text-align:center;z-index:1}.score-orb span,.score-orb b{display:block;font:9px 'DM Mono';color:#686861}.score-orb strong{font-size:68px;letter-spacing:-.08em;display:block}.score-orb strong small{font-size:20px}.metrics{border-left:1px solid var(--line);padding-left:40px}.metric{margin:18px 0}.metric-head{display:flex;justify-content:space-between;font:10px 'DM Mono';color:#85857f}.metric-head b{color:#eee}.metric-bar{height:4px;background:#22221f;margin-top:8px}.metric-bar i{display:block;height:100%;background:var(--red)}.metric p{font-size:11px;color:#62625c;margin:7px 0}.global{border:1px solid #2b2b27;margin-top:65px;padding:25px;display:flex;justify-content:space-between;align-items:center}.global h3{font-size:32px;margin:18px 0 4px}.global h3 span{font-size:12px;color:#6c6c66;font-weight:400}.global p{font-size:10px;color:#5f5f5a}.mini-chart{height:65px;display:flex;align-items:end;gap:4px;width:160px}.mini-chart i{width:10px;background:#343430}.mini-chart i.hit{background:#77776f}.mini-chart i.miss{background:var(--red)}.result-actions{display:flex;gap:10px;margin-top:30px}.ghost{background:none;border:1px solid #2b2b27;padding:12px 15px;font:10px 'DM Mono';cursor:pointer;color:#8b8b84}footer{border-top:1px solid var(--line);padding:15px 25px;color:#44443f;font-size:8px;display:flex;justify-content:space-between;letter-spacing:.08em}@media(max-width:700px){.status{display:none}.topbar{height:60px}.home{padding-top:65px}.hero h1{font-size:17vw}.lede{font-size:15px}.actions{align-items:flex-start;flex-direction:column}.home-grid{grid-template-columns:1fr;margin-top:70px}.index-card{border-left:0;border-top:1px solid var(--line);padding-left:0}.game,.result{padding-top:35px}.challenge{padding:20px}.choices{grid-template-columns:1fr}.result-layout{grid-template-columns:1fr;gap:35px}.metrics{border-left:0;border-top:1px solid var(--line);padding:20px 0 0}.score-orb{width:190px;height:190px}.global{align-items:flex-start;gap:20px;flex-direction:column}.mini-chart{width:100%}.challenge h2{font-size:32px}.artifact pre{font-size:12px}.big-index{font-size:70px}}
</style></head><body><div class="app"><div class="noise"></div><header class="topbar"><button class="brand" onclick="resetGame()"><span class="brand-mark">◈</span> THE LAST HUMAN</button><div class="status"><span class="dot"></span>SYSTEM ONLINE <span class="sep">/</span> NERDEARLA 2026</div></header><div id="root"></div><footer><span>THL / 001</span><span>CAN YOU TELL?</span><span>NO SIGNAL IS PERFECT</span></footer></div><script>
const challenges=[
['TEXT','The midnight train','Short prose · 74 words · blind sample',`I missed the last train by about thirty seconds. The doors closed while I was still running, which sounds dramatic until you remember that stations mostly just smell like old coffee at midnight. I sat on the bench and texted my sister. She replied with a photo of the dog looking disappointed.`,'HUMAN','The strongest human signal is the oddly specific, low-stakes observation: “stations mostly just smell like old coffee.” The voice also allows a small anti-dramatic correction instead of escalating the story.',[['Specificity',91],['Narrative symmetry',28],['Unexpected detail',88]],'MEDIUM'],
['CHAT','A difficult message','Chat excerpt · 6 messages',`Maya: can you send the file tonight?\nLeo: I can, but it is going to be ugly\nMaya: ugly is fine\nLeo: define fine\nMaya: “I can open it” fine\nLeo: then yes lol`,'HUMAN','The interruption and repair in “define fine” create conversational friction common in real messaging. The final “lol” resolves tension without explaining the joke.',[['Conversational friction',94],['Perfect structure',19],['Social shorthand',86]],'EASY'],
['CODE','A tiny utility','JavaScript · 9 lines · no framework',`function once(fn) {\n  let done = false;\n  return (...args) => {\n    if (done) return;\n    done = true;\n    return fn(...args);\n  };\n}`,'AI','The signal is not “good code = AI.” It is the deliberately generic utility shape with no surrounding context, error policy, or naming constraints. It reads like a canonical pattern generated from a short prompt.',[['Canonical pattern',92],['Contextual constraints',14],['Minimalism',83]],'MEDIUM'],
['DOCUMENT','Project update','Work memo · 108 words',`Status: the migration is complete for 8/10 services.\n\nThe remaining two are blocked by vendor credentials. We expect access tomorrow. No customer-facing downtime has occurred.\n\nRisk: if credentials arrive after 16:00, validation will move to Monday.\n\nNext: confirm credentials, run smoke tests, attach logs, and update the incident record.`,'AI','This sample has unusually clean parallel structure and exhaustive status framing. Real teams can write this way, but here the combination of symmetrical sections and generic risk language is the intended signal.',[['Parallel structure',95],['Personal specificity',18],['Template language',89]],'HARD'],
['TEXT','The wrong coffee','Personal note · 91 words',`I ordered the usual and got oat milk. I do not drink oat milk. The barista had already called my name, so I took it because correcting someone over coffee felt like too much admin for 8:12 in the morning. It was actually fine. This is annoying because now I have accidentally learned that I like oat milk.`,'HUMAN','The reversal is small and personal: the narrator starts with a complaint and ends by admitting the mistake changed their preference. That kind of self-correction is a useful—but not infallible—human signal.',[['Self-correction',90],['Over-explaining',22],['Specific context',87]],'EASY'],
['CHAT','Support ticket #4812','Customer support · anonymized',`Customer: It still says pending.\nAgent: I know. I am looking at it now.\nCustomer: okay\nAgent: I am going to refresh the payment state manually. If that does not work I will refund it.\nCustomer: thank you\nAgent: no problem — give me two minutes`,'AI','The language is unusually controlled for a live support exchange. Every message advances the workflow, with almost no ambiguity, interruption, or personal shorthand.',[['Workflow completeness',93],['Ambiguity',11],['Natural interruption',24]],'HARD'],
['TEXT','A bad first draft','Creative writing · 122 words',`The city was beautiful in the way a broken phone screen is beautiful: technically still working, but only if you hold it at exactly the right angle. I wrote that down and immediately hated it. Then I kept it anyway because the notebook was already open and I was tired.`,'HUMAN','The meta-commentary (“I wrote that down and immediately hated it”) breaks the polished metaphor. The writing contains an imperfect creative process rather than only the finished image.',[['Meta-awareness',92],['Polished metaphor',61],['Revision trace',89]],'MEDIUM'],
['CODE','The validator','TypeScript · 12 lines',`const isValidEmail = (value: string) => {\n  const trimmed = value.trim();\n  if (!trimmed) return false;\n  return /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/.test(trimmed);\n};`,'AI','This is plausible human code, but the sample intentionally combines a generic name, a familiar regex, and a tidy happy-path-only implementation. There is no product-specific requirement or surrounding context.',[['Generic abstraction',88],['Domain context',16],['Canonical regex',91]],'MEDIUM'],
['DOCUMENT','Meeting notes','Internal notes · 83 words',`Things we agreed on:\n- stop calling it “the new thing”\n- move the demo to Thursday\n- ask Paula about the missing screenshot\n- do not touch production before lunch\n\nThings nobody agreed on:\n- who is actually presenting\n- whether the old dashboard is dead\n- who owns the spreadsheet`,'HUMAN','The asymmetry is the clue. The notes preserve unresolved ownership and an informal joke instead of converting the meeting into a perfectly resolved summary.',[['Unresolved ambiguity',93],['Formal structure',31],['Informal language',90]],'EASY'],
['TEXT','The perfect ending','Micro-fiction · 96 words',`She closed the laptop, looked out at the rain, and finally understood that some endings are not failures but invitations to begin again. Outside, the city continued to breathe beneath the silver sky.`,'AI','Nothing here is impossible for a human to write. The signal is the density of familiar closure language: “endings,” “begin again,” “city continued to breathe,” and “silver sky” combine into a recognizable inspirational cadence.',[['Familiar phrasing',96],['Concrete specificity',20],['Closure cadence',94]],'HARD']
];
let screen='home',idx=0,score=0,answers=[],picked=null,showWhy=false;
const $=s=>document.querySelector(s); const esc=s=>s.replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
function render(){if(screen==='home')home();else if(screen==='game')game();else result()}
function home(){document.querySelector('#root').innerHTML=`<main class="home"><section class="hero"><div class="eyebrow"><span class="pulse"></span>HUMANITY DETECTION PROTOCOL</div><h1>THE LAST<br><em>HUMAN.</em></h1><p class="lede">AI can write like us. It can code like us. It can even make mistakes like us.<br><strong>Can your instincts still tell the difference?</strong></p><div class="actions"><button class="primary" onclick="startGame()">START TEST →</button><div class="micro">◷ 10 rounds · ~3 min</div></div></section><section class="home-grid"><div class="protocol"><span class="tiny-label">THE PROTOCOL</span><div class="protocol-line"><span>01</span><div><b>OBSERVE</b><small>Read without knowing the source.</small></div></div><div class="protocol-line"><span>02</span><div><b>DECIDE</b><small>Trust your first instinct.</small></div></div><div class="protocol-line"><span>03</span><div><b>QUESTION</b><small>Discover which signals shaped you.</small></div></div></div><div class="index-card"><div class="tiny-label">◎ GLOBAL HUMAN INDEX</div><div class="big-index">—<span>%</span></div><p>Waiting for the first field data.</p><div class="index-bars"><i></i><i></i><i></i><i></i><i></i></div><small>INDEX INITIALIZING · LIVE DATA WILL APPEAR AFTER DEPLOYMENT</small></div></section><div class="warning">⌁ NO TRAINING DATA. NO PERSONAL DATA. JUST YOUR JUDGMENT.</div></main>`}
function startGame(){screen='game';render()}
function game(){const c=challenges[idx];const p=((idx+(picked?1:0))/challenges.length)*100;document.querySelector('#root').innerHTML=`<main class="game"><div class="game-head"><div><span class="tiny-label">ROUND ${String(idx+1).padStart(2,'0')} / ${String(challenges.length).padStart(2,'0')}</span><div class="progress"><i style="width:${p}%"></i></div></div><div class="score">SCORE <b>${String(score).padStart(2,'0')}</b></div></div><section class="challenge"><div class="challenge-meta"><span>◈ ${c[0]}</span><span>THL-${String(idx+1).padStart(2,'0')}</span><span>${c[6]}</span></div><h2>${c[1]}</h2><p class="meta">${c[2]}</p><div class="artifact ${c[0].toLowerCase()}">${c[0]==='CODE'?'<div class="code-top">⌘ sample.ts <span>•••</span></div>':''}${c[0]==='CHAT'?'<div class="chat-label">◌ CONVERSATION EXCERPT</div>':''}<pre>${esc(c[3])}</pre></div><div class="decision-label">WHO CREATED THIS?</div><div class="choices"><button class="choice human ${picked?'disabled':''} ${picked==='HUMAN'?'chosen':''}" onclick="choose('HUMAN')" ${picked?'disabled':''}><span class="icon">◯</span><span>HUMAN</span><small>made by a person</small></button><button class="choice ai ${picked?'disabled':''} ${picked==='AI'?'chosen':''}" onclick="choose('AI')" ${picked?'disabled':''}><span class="icon">✦</span><span>AI</span><small>generated by a model</small></button></div>${picked?reveal(c):''}</section></main>`}
function choose(v){if(picked)return;picked=v;const c=challenges[idx];const correct=v===c[4];if(correct)score++;answers.push({correct,answer:v,item:c});render()}
function reveal(c){const correct=picked===c[4];return `<div class="reveal ${correct?'correct':'wrong'}"><div class="reveal-top"><span>${correct?'✓ CORRECT':'× NOT QUITE'}</span><b>IT WAS ${c[4]}</b></div><p>${c[5]}</p><button class="why" onclick="toggleWhy()">${showWhy?'HIDE SIGNALS':'WHY DID IT LOOK THIS WAY?'} ${showWhy?'⌃':'⌄'}</button>${showWhy?`<div class="signals">${c[6].map(x=>`<div class="signal"><div class="signal-head"><span>${x[0]}</span><b>${x[1]}</b></div><div class="signal-bar"><i style="width:${x[1]}%"></i></div></div>`).join('')}</div>`:''}<button class="next" onclick="nextRound()">${idx===challenges.length-1?'SEE MY FINGERPRINT':'NEXT SUBJECT'} →</button></div>`}
function toggleWhy(){showWhy=!showWhy;render()}
function nextRound(){if(idx===challenges.length-1){screen='result';render();return}idx++;picked=null;showWhy=false;render()}
function result(){const accuracy=Math.round(score/challenges.length*100),humanBias=Math.round(answers.filter(x=>x.answer==='HUMAN').length/challenges.length*100),instinct=Math.min(99,Math.round(55+accuracy*.43)),risk=Math.max(12,100-accuracy);document.querySelector('#root').innerHTML=`<main class="result"><div class="result-kicker">✦ FIELD REPORT COMPLETE</div><h1>YOUR HUMAN<br><em>FINGERPRINT.</em></h1><p class="result-lede">You didn't just get answers right. You revealed a pattern in how you read the machine.</p><section class="result-layout"><div class="score-orb"><div><span>ACCURACY</span><strong>${accuracy}<small>%</small></strong><b>${score}/${challenges.length}</b></div></div><div class="metrics">${metric('HUMAN INSTINCT',instinct,'How strongly your choices aligned with the hidden source.')}${metric('HUMAN BIAS',humanBias,'How often you leaned toward the human explanation.')}${metric('UNCERTAINTY',risk,'Where the evidence was hardest to separate.')}</div></section><section class="global"><div><div class="tiny-label">◎ GLOBAL HUMAN INDEX</div><h3>${accuracy}% <span>of your decisions were correct.</span></h3><p>This is local field data for your run. It becomes a shared index when connected to persistent storage.</p></div><div class="mini-chart">${answers.map(a=>`<i class="${a.correct?'hit':'miss'}" style="height:${a.correct?'85':'45'}%"></i>`).join('')}</div></section><div class="result-actions"><button class="primary" onclick="resetGame()">↻ RUN AGAIN</button><button class="ghost" onclick="copyResult(${accuracy})">COPY RESULT</button></div></main>`}
function metric(l,v,n){return `<div class="metric"><div class="metric-head"><span>${l}</span><b>${v}</b></div><div class="metric-bar"><i style="width:${v}%"></i></div><p>${n}</p></div>`}
function copyResult(a){navigator.clipboard?.writeText(`THE LAST HUMAN — ${a}% accuracy`)}
function resetGame(){screen='home';idx=0;score=0;answers=[];picked=null;showWhy=false;render()}
render();
</script></body></html>
